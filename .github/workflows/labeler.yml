# Labels every PR from its branch name and paths; .github/labeler.yml holds the rules.
#   - `pull_request`, not `pull_request_target`, so a PR that edits the rules is labelled by them. A
#     PR from a fork gets a read-only token and fails here.
#   - No `issues: write`, which would let the action create a missing label with no description. A
#     missing label should fail the run; docs/repo-settings.md lists them.
name: Labeler

on: pull_request

concurrency:
  group: labeler-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    # Dependabot's runs get a read-only token, so dependabot.yml labels its PRs instead.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v7
        with:
          dot: true
